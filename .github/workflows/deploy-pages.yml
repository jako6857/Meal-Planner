name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Validate Supabase secrets
        run: |
          echo "Supabase URL set: $([ -n \"$VITE_SUPABASE_URL\" ] && echo yes || echo no)"
          echo "Supabase anon key set: $([ -n \"$VITE_SUPABASE_ANON_KEY\" ] && echo yes || echo no)"
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Missing VITE_SUPABASE_URL and/or VITE_SUPABASE_ANON_KEY (set them as repository Secrets or Variables)"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        if: success()
        run: |
          cd dist
          git init
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add .
          git commit -m "Deploy dist to gh-pages"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:gh-pages
